# ════════════════════════════════════════════════════════════════
# Render.com Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Энэ файл нь backend (Node web service) + PostgreSQL хоёрыг
# нэг дор үүсгэнэ. Render dashboard → New + → Blueprint → repo сонгоно
#
# Үлдсэн алхамууд (Render dashboard дотор):
#   1. Sync хийсний дараа `malchingeree-api` service-н Environment tab-д
#      sync:false тэмдэглэгдсэн env var-уудыг гар утгаар оруулна
#      (FRONTEND_URL, EMAIL_*, CLOUDINARY_*).
#   2. Frontend (Vercel)-ийн URL-аа FRONTEND_URL-д бичсэний дараа re-deploy.
#   3. Анхны deploy-ийн дараа `/health` endpoint 200 буцаагаа эсэхийг шалга.
# ════════════════════════════════════════════════════════════════

services:
  - type: web
    name: malchingeree-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore           # Монголд хамгийн ойр Render region
    buildCommand: npm ci
    # Migration-ийг start-ын өмнө гүйцэтгэнэ. Идэмпотент — apply
    # хийгдсэн migration-ийг алгасна (scripts/migrate.js).
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # PostgreSQL connection string — доорх database-аас автоматаар татна
      - key: DATABASE_URL
        fromDatabase:
          name: malchingeree-db
          property: connectionString
      # JWT secret — Render автоматаар random үүсгэнэ (32 char hex)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: OTP_EXPIRES_MIN
        value: 15
      # ── Дараах env var-уудыг dashboard дотор гар утгаар оруулна ──
      # FRONTEND_URL: Vercel-ийн production URL (+ preview, comma-аар)
      #   жишээ: https://malchingeree.vercel.app,https://staging.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: malchingeree-db
    plan: free
    databaseName: e_contract
    user: ec_user
    region: singapore
    # Free plan: 90 хоног, 1GB storage, 256MB RAM — diploma demo-д хангалттай.
    # Production-д шилжихдээ plan: starter ($7/mo) болгож upgrade хийнэ.
    postgresMajorVersion: "16"
