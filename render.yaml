
# Render.com Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec


services:
  - type: web
    name: malchingeree-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore           
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: malchingeree-db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: OTP_EXPIRES_MIN
        value: 15

      - key: FRONTEND_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: malchingeree-db
    plan: free
    databaseName: e_contract
    user: ec_user
    region: singapore

    postgresMajorVersion: "16"
